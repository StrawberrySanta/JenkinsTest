version: '3.8'

services:
  jenkins:
    build: .                    # 👈 вместо image указываем сборку из Dockerfile
    container_name: jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # 👈 пробрасываем Docker сокет

volumes:
  jenkins_home: